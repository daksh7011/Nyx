# Reusable iOS build chain on a GitHub-hosted macOS runner. Called by ci / develop / master as a
# separate chain. Not triggered on its own.
name: iOS Build

on:
  workflow_call:

jobs:
  ios:
    name: iOS framework (device + simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # The Kotlin/Native toolchain and its platform libs are ~1GB and are re-downloaded on every
      # cold runner otherwise. Keyed on the catalog so a Kotlin version bump invalidates it.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Compile + link iOS frameworks (device + simulator)
        run: |
          ./gradlew :client:compileKotlinIosArm64 :client:compileKotlinIosSimulatorArm64
          ./gradlew :client:linkDebugFrameworkIosArm64 :client:linkDebugFrameworkIosSimulatorArm64
