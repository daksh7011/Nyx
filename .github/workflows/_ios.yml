# Reusable iOS build chain on a self-hosted macOS runner. Called by ci / develop / master as a
# separate chain. Not triggered on its own.
name: iOS Build

on:
  workflow_call:

jobs:
  ios:
    name: iOS framework (device + simulator)
    # Register self-hosted macOS runners with these labels. ARM64 is required —
    # iosSimulatorArm64 links only on Apple Silicon.
    runs-on: [self-hosted, macOS, ARM64]
    # Security: never run a fork's PR code on a self-hosted machine. Only same-repo
    # PRs and branch pushes reach the runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile + link iOS frameworks (device + simulator)
        run: |
          ./gradlew :client:compileKotlinIosArm64 :client:compileKotlinIosSimulatorArm64
          ./gradlew :client:linkDebugFrameworkIosArm64 :client:linkDebugFrameworkIosSimulatorArm64
