# Runs on every pull request. Linux build/verify chain plus the iOS chain on a self-hosted macOS runner.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build.yml

  ios:
    uses: ./.github/workflows/_ios.yml
