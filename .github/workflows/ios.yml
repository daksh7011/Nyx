name: iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "client/src/iosMain/**"
      - "client/iosApp/**"
      - "client/build.gradle.kts"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-compile:
    # Self-hosted macOS runners (register with these labels). ARM64 is required —
    # iosSimulatorArm64 links only on Apple Silicon.
    runs-on: [self-hosted, macOS, ARM64]
    # Security: never run a fork's PR code on a self-hosted machine. Only same-repo
    # PRs and manual dispatch reach the runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile + link the iOS framework
        run: |
          ./gradlew :client:compileKotlinIosSimulatorArm64
          ./gradlew :client:linkDebugFrameworkIosSimulatorArm64
